<div class="ds-toast" id="alertContainer"></div>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script>
function $(id) { return document.getElementById(id); }

const API = "/api";
let tickerSince = new Date(Date.now() - 5 * 60 * 1000).toISOString();
let tickerTimer = null;
let sseSource = null;
const MAX_TICKER_ITEMS = 100;
let tickerItems = [];

// ── Theme ──
function initTheme() {
  const saved = localStorage.getItem("f402-theme");
  const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  const theme = saved || (prefersLight ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
  $("themeToggle").textContent = theme === "light" ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("f402-theme", next);
  $("themeToggle").textContent = next === "light" ? "☀️" : "🌙";
}
initTheme();

// ── Request Deduplication & Caching ──
const apiCache = new Map();
const inFlight = new Map();

function getCacheTTL(path) {
  const interval = getRefreshInterval(path);
  return interval === "realtime" ? 2000 : Math.max(interval * 0.8, 2000);
}

async function fetchWithDedupe(path, options = {}) {
  const key = path + (options.body || "");
  const isRead = !options.method || options.method === "GET";
  const now = Date.now();

  // Reuse in-flight promise
  if (inFlight.has(key)) {
    return inFlight.get(key);
  }

  // Return cached response if still fresh (GET only)
  if (isRead && apiCache.has(path)) {
    const cached = apiCache.get(path);
    if (now - cached.ts < cached.ttl) {
      return Promise.resolve(cached.data);
    }
  }

  const promise = (async () => {
    try {
      const res = await fetch(`${API}${path}`, options);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (isRead) {
        apiCache.set(path, { data, ts: now, ttl: getCacheTTL(path) });
      }
      return data;
    } finally {
      inFlight.delete(key);
    }
  })();

  inFlight.set(key, promise);
  return promise;
}

async function api(path) {
  return fetchWithDedupe(path);
}

async function apiPost(path, body) {
  return fetchWithDedupe(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

async function apiPatch(path, body) {
  return fetchWithDedupe(path, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

async function apiDelete(path) {
  return fetchWithDedupe(path, { method: "DELETE" });
}

function fmt(n) {
  if (n == null) return "-";
  return n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function usd(n) {
  if (n == null) return "-";
  return "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function tag(wt) {
  const map = { S: "straight", P: "parlay", M: "moneyline", L: "live" };
  return `<span class="ds-badge ds-badge-${wt.toLowerCase()}">${map[wt] || wt}</span>`;
}

function ago(iso) {
  if (!iso) return "";
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function updateConn(status) {
  const el = $("connStatus");
  el.className = "ds-conn-status ds-conn-" + status;
}

function matchesTickerFilters(w) {
  const type = $("tickerType").value;
  const min = parseInt($("tickerMin").value) || 0;
  if (type && w.wager_type !== type) return false;
  if (min > 0 && w.amount_wagered < min * 100) return false;
  return true;
}

function renderTicker() {
  const feed = $("tickerFeed");
  const filtered = tickerItems.filter(matchesTickerFilters);
  if (!filtered.length) {
    if (tickerItems.length === 0) {
      feed.innerHTML = `
        <div class="ds-skeleton ds-skeleton-ticker"></div>
        <div class="ds-skeleton ds-skeleton-ticker"></div>
        <div class="ds-skeleton ds-skeleton-ticker"></div>
      `;
    } else {
      feed.innerHTML = '<div class="ds-loading">No wagers match filters</div>';
    }
    return;
  }
  const items = filtered.map(w => `
    <div class="ds-ticker-item">
      <span class="ds-login">${w.login || "?"}</span>
      <span>${tag(w.wager_type)}</span>
      <span class="ds-amount">${usd(w.amount_wagered)}</span>
      <span class="ds-time">${ago(w.captured_at)}</span>
    </div>
  `).join("");
  feed.innerHTML = items;
}

function addWagerToTicker(wager) {
  tickerItems.unshift(wager);
  if (tickerItems.length > MAX_TICKER_ITEMS) {
    tickerItems = tickerItems.slice(0, MAX_TICKER_ITEMS);
  }
  if (wager.captured_at) {
    tickerSince = wager.captured_at;
  }
  renderTicker();
  $("lastUpdate").textContent = new Date().toLocaleTimeString();
  checkThresholds([wager]);
  updateConn("connected");
}

async function connectSSE() {
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  clearInterval(tickerTimer);
  tickerTimer = null;
  updateConn("polling");

  // Seed ticker with recent wagers via API
  try {
    const d = await api(`/bet-ticker-wagers?limit=50&since=${encodeURIComponent(tickerSince)}`);
    if (d.wagers?.length) {
      for (const w of d.wagers.reverse()) {
        addWagerToTicker(w);
      }
    }
  } catch (e) {
    console.warn("seed fetch failed", e);
  }

  // Connect SSE for live updates — use the latest captured_at as the since param
  const since = tickerSince ? `?since=${encodeURIComponent(tickerSince)}` : "";
  sseSource = new EventSource(`${API}/live-wagers${since}`);

  sseSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      const wager = data.wager || data;
      addWagerToTicker(wager);
    } catch (e) {
      console.error("SSE parse error", e);
    }
  };

  sseSource.onopen = () => {
    updateConn("connected");
    clearInterval(tickerTimer);
    tickerTimer = null;
  };

  sseSource.onerror = () => {
    updateConn("error");
  };

  // Fallback polling after 10s if SSE never connected
  setTimeout(() => {
    if (sseSource && sseSource.readyState !== EventSource.OPEN && !tickerTimer) {
      startPollingFallback();
    }
  }, 10000);
}

function startPollingFallback() {
  if (tickerTimer) return;
  tickerTimer = setInterval(async () => {
    try {
      const since = new Date(Date.now() - 10000).toISOString();
      const res = await fetch(`${API}/bet-ticker-wagers?since=${encodeURIComponent(since)}&limit=50`);
      if (!res.ok) return;
      const d = await res.json();
      if (d.wagers?.length) {
        for (const w of d.wagers) {
          const exists = tickerItems.some(item => item.id === w.id);
          if (!exists) {
            addWagerToTicker(w);
          }
        }
        updateConn("connected");
      }
    } catch (e) {
      updateConn("error");
    }
  }, 5000);
}

function switchTab(name) {
  document.querySelectorAll(".ds-tab").forEach(t => {
    t.classList.remove("ds-active");
    t.setAttribute("aria-selected", "false");
  });
  document.querySelectorAll(".ds-tab-content").forEach(t => t.classList.remove("ds-active"));
  const activeTab = document.querySelector(`.ds-tab[data-tab="${name}"]`);
  activeTab.classList.add("ds-active");
  activeTab.setAttribute("aria-selected", "true");
  document.getElementById(`tab-${name}`).classList.add("ds-active");

  if (name === "monitor") {
    clearInterval(tickerTimer);
    tickerTimer = null;
    if (!sseSource) connectSSE();
  } else if (name === "alerts") {
    if (sseSource) { sseSource.close(); sseSource = null; }
    clearInterval(tickerTimer);
    tickerTimer = null;
    loadAlerts();
  }
}

// ── Alerts tab ──

async function loadAlerts() {
  $("lastUpdate").textContent = new Date().toLocaleTimeString();
  await Promise.all([loadAlertRules(), loadAlertLog()]);
}

async function loadAlertRules() {
  try {
    const d = await api("/alert-rules?limit=100");
    if (!d.rules?.length) { $("alertRulesList").innerHTML = '<div class="ds-loading">No alert rules configured</div>'; return; }
    $("alertRulesList").innerHTML = d.rules.map(r => `
      <div class="ds-rule-row">
        <span class="ds-badge ds-badge-${r.severity}">${r.severity}</span>
        <span><strong>${r.metric}</strong> ${r.operator} ${fmt(r.threshold)}</span>
        <span class="ds-subtitle">agent: ${r.agent_id}</span>
        <span class="ds-rule-meta">${r.enabled ? '✅ enabled' : '⏸ disabled'}</span>
        <button class="ds-btn ds-btn-sm ${r.enabled ? 'ds-btn-amber' : 'ds-btn'}" onclick="toggleAlertRule('${r.id}', ${!r.enabled})">${r.enabled ? 'Disable' : 'Enable'}</button>
        <button class="ds-btn ds-btn-sm ds-btn-danger" onclick="deleteAlertRule('${r.id}')">Delete</button>
      </div>
    `).join("");
  } catch (e) {
    $("alertRulesList").innerHTML = renderErrorState(e.message, "/alert-rules");
  }
}

async function loadAlertLog() {
  try {
    const severity = $("logSeverity").value;
    const agent = $("logAgent").value.trim();
    let path = "/alert-log?limit=100";
    if (severity) path += `&severity=${severity}`;
    if (agent) path += `&agent_id=${encodeURIComponent(agent)}`;
    const d = await api(path);
    if (!d.entries?.length) { $("alertLogFeed").innerHTML = '<div class="ds-loading">No alert breaches</div>'; return; }
    $("alertLogFeed").innerHTML = `<table class="ds-table-sm"><thead><tr><th>Time</th><th>Severity</th><th>Agent</th><th>Rule</th><th>Actual</th><th>Threshold</th></tr></thead><tbody>${
      d.entries.map(e => `<tr>
        <td class="ds-time">${ago(e.created_at)}</td>
        <td>${severityBadge(e.severity)}</td>
        <td><strong>${e.agent_id}</strong></td>
        <td class="ds-cell-sm">${e.metric} ${e.operator}</td>
        <td class="${Number(e.actual_value) > Number(e.threshold) ? 'ds-negative' : 'ds-positive'}">${fmt(e.actual_value)}</td>
        <td>${fmt(e.threshold)}</td>
      </tr>`).join("")
    }</tbody></table>`;
  } catch (e) {
    $("alertLogFeed").innerHTML = renderErrorState(e.message, "/alert-log");
  }
}

async function createAlertRule() {
  const metric = $("ruleMetric").value;
  const operator = $("ruleOperator").value;
  const threshold = parseInt($("ruleThreshold").value) || 0;
  const severity = $("ruleSeverity").value;
  const agentId = $("ruleAgent").value.trim() || "*";
  try {
    const result = await apiPost("/alert-rules", { metric, operator, threshold, severity, agent_id: agentId });
    if (result.status === "created") {
      showAlert(`Alert rule created: ${metric} ${operator} ${threshold}`, "info");
      await loadAlertRules();
    }
  } catch (e) {
    showAlert(`Failed: ${e.message}`, "error");
  }
}

async function toggleAlertRule(id, enabled) {
  try {
    await apiPatch(`/alert-rules?id=${id}`, { enabled });
    await loadAlertRules();
  } catch (e) {
    showAlert(`Failed to toggle: ${e.message}`, "error");
  }
}

async function deleteAlertRule(id) {
  try {
    await apiDelete(`/alert-rules?id=${id}`);
    await loadAlertRules();
  } catch (e) {
    showAlert(`Failed to delete: ${e.message}`, "error");
  }
}

function severityBadge(sev) {
  return `<span class="ds-badge ds-badge-${sev}">${sev}</span>`;
}

// ── Summary cards ──
async function loadSummary() {
  try {
    const d = await api("/summary");
    $("summaryCards").innerHTML = `
      <div class="ds-card"><div class="ds-label">Live Wagers Today</div><div class="ds-value">${fmt(d.liveWagers.total)}</div><div class="ds-sub">${usd(d.liveWagers.volume)} volume · ${d.liveWagers.agents} agents</div></div>
      <div class="ds-card"><div class="ds-label">Graded Wagers Today</div><div class="ds-value">${fmt(d.gradedWagers.total)}</div><div class="ds-sub">PNL: <span class="${d.gradedWagers.pnl >= 0 ? 'ds-positive' : 'ds-negative'}">${usd(d.gradedWagers.pnl)}</span></div></div>
      <div class="ds-card"><div class="ds-label">Top Agents</div><div class="ds-value ds-text-md">${d.topAgents.map(a => a.agent_id).join(", ") || "none"}</div><div class="ds-sub">${d.topAgents.length} agents with activity today</div></div>
      <div class="ds-card"><div class="ds-label">Top Sport</div><div class="ds-value ds-text-md">${d.topSports[0]?.sport_name || "N/A"}</div><div class="ds-sub">${usd(d.topSports[0]?.volume)} volume</div></div>
    `;
  } catch (e) {
    $("summaryCards").innerHTML = renderErrorState(e.message, "/summary");
  }
}

// Agent performance
async function loadAgents() {
  try {
    const d = await api("/performance?limit=20");
    if (!d.records?.length) { $("agentTable").innerHTML = '<div class="ds-loading">No agent data</div>'; return; }
    const rows = d.records.map(a => `
      <tr>
        <td><strong>${a.agent_id}</strong></td>
        <td>${fmt(a.total_wagers)}</td>
        <td>${usd(a.total_volume)}</td>
        <td class="${a.win_rate >= 50 ? 'ds-positive' : 'ds-negative'}">${a.win_rate?.toFixed(1) ?? "-"}%</td>
      </tr>
    `).join("");
    $("agentTable").innerHTML = `<table><thead><tr><th>Agent</th><th>Wagers</th><th>Volume</th><th>Win%</th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) {
    $("agentTable").innerHTML = renderErrorState(e.message, "/performance");
  }
}

// Graded wagers
async function loadGraded() {
  try {
    const result = $("gradedResult").value;
    const agent = $("gradedAgent").value.trim();
    let path = "/graded-wagers?limit=30";
    if (result) path += `&wager_type=${result}`;
    if (agent) path += `&agent_id=${encodeURIComponent(agent)}`;
    const d = await api(path);
    if (!d.wagers?.length) { $("gradedFeed").innerHTML = '<div class="ds-loading">No graded wagers found</div>'; return; }
    const rows = d.wagers.map(w => `
      <tr>
        <td>${w.wager_number}</td>
        <td>${w.login}</td>
        <td>${usd(w.amount_wagered)}</td>
        <td class="${w.net_amount >= 0 ? 'ds-positive' : 'ds-negative'}">${usd(w.net_amount ?? 0)}</td>
        <td><span class="ds-badge ds-badge-${(w.result || 'x').toLowerCase()}">${w.result || "?"}</span></td>
        <td class="ds-time">${ago(w.grade_date_time || w.captured_at)}</td>
      </tr>
    `).join("");
    $("gradedFeed").innerHTML = `<table class="ds-table-sm"><thead><tr><th>#</th><th>Login</th><th>Amount</th><th>Net</th><th>Result</th><th>When</th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) {
    $("gradedFeed").innerHTML = renderErrorState(e.message, "/graded-wagers");
  }
}

// Authorizations
async function loadAuth() {
  try {
    const d = await api("/authorizations?limit=50");
    if (!d.records?.length) { $("authGrid").innerHTML = '<div class="ds-loading">No authorization data</div>'; return; }
    const cards = d.records.map(a => `
      <div class="ds-auth-card">
        <div class="ds-auth-card__title">${a.agent_id}</div>
        <div class="ds-auth-card__meta">Master: ${a.master_agent_id || "-"}</div>
        <div class="ds-auth-card__meta">Comm: ${a.commission_type || "-"}</div>
      </div>
    `).join("");
    $("authGrid").innerHTML = cards || '<div class="ds-loading">No agents authorized</div>';
  } catch (e) {
    $("authGrid").innerHTML = renderErrorState(e.message, "/authorizations");
  }
}

// Threshold alerts
const ALERT_THRESHOLDS = {
  maxWager: 50000,
  maxLossPerAgent: 100000,
  agentDailyLoss: {},
};

function checkThresholds(wagers) {
  for (const w of wagers) {
    if (w.amount_wagered > ALERT_THRESHOLDS.maxWager) {
      showAlert(`Large wager: ${w.login || w.customer_id} wagered ${usd(w.amount_wagered)}`, "warn");
    }
  }
}

function showAlert(msg, severity = "warn") {
  const container = $("alertContainer");
  const el = document.createElement("div");
  el.className = `ds-toast-item ds-toast-item--${severity}`;
  el.innerHTML = `${msg} <span class="ds-dismiss" onclick="this.parentElement.remove()">✕</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 8000);
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("Fantasy402 Alert", { body: msg });
  }
}

function renderErrorState(msg, endpoint = "") {
  const zone = getZone(endpoint);
  const zoneClass = zone !== "worker" ? `ds-error-state--${zone}` : "";
  return `<div class="ds-error-state ${zoneClass}">${msg}</div>`;
}

function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

// Filter change handlers
$("tickerType").addEventListener("change", renderTicker);
$("tickerMin").addEventListener("input", renderTicker);
$("gradedResult").addEventListener("change", loadGraded);
$("gradedAgent").addEventListener("input", loadGraded);

// Initial load
async function init() {
  requestNotificationPermission();
  $("lastUpdate").textContent = new Date().toLocaleTimeString();
  await Promise.all([loadSummary(), loadAgents(), loadGraded(), loadAuth()]);
  connectSSE();
  AutoRefreshManager.register("summary", loadSummary, getRefreshInterval('/summary'));
  AutoRefreshManager.register("agents", loadAgents, getRefreshInterval('/performance'));
  AutoRefreshManager.register("graded", loadGraded, getRefreshInterval('/graded-wagers'));
  AutoRefreshManager.register("auth", loadAuth, getRefreshInterval('/authorizations'));
}

// Pause/resume intervals when tab hidden/visible to save Worker load
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    // Tab hidden: pause all polling intervals (SSE stays alive)
    AutoRefreshManager.pause();
  } else {
    // Tab visible: immediately refresh and re-register intervals
    loadSummary(); loadAgents(); loadGraded(); loadAuth();
    AutoRefreshManager.register("summary", loadSummary, getRefreshInterval('/summary'));
    AutoRefreshManager.register("agents", loadAgents, getRefreshInterval('/performance'));
    AutoRefreshManager.register("graded", loadGraded, getRefreshInterval('/graded-wagers'));
    AutoRefreshManager.register("auth", loadAuth, getRefreshInterval('/authorizations'));
  }
});

init();
</script>
