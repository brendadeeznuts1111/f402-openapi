openapi: 3.1.0
info:
  title: 'Fantasy402 API (Secured Observed Contract)'
  version: 2026-05-17-slim-v1.2
  description: 'Security-hardened OpenAPI contract derived from the observed browser-to-api capture. Passwords and credential fields are intentionally removed from schemas and examples. Role requirements, hierarchy validation, rate-limit expectations, and sensitive-data annotations are encoded as contract metadata. Bulky observed examples and sample-derived large enums are removed for CI, linting, code generation, and mock-server use. Includes a small set of synthetic, non-sensitive examples for docs and mock servers.'
  contact:
    name: BILLY666 / Sports Terminal
    url: 'https://factory-wager.com'
  x-api-state: observed
  x-last-captured: 2026-05-08
  x-next-review: 2026-06-08
  x-ai-discovery:
    llmsTxt: ./llms.txt
    stableJson: ./openapi.json
    stableYaml: ./openapi.yaml
servers:
  - url: 'https://fantasy402.com'
    description: Production. Requires authenticated session cookie or agent bearer token.
paths:
  /cloud/api/System/authenticateCustomer:
    post:
      summary: POST /cloud/api/System/authenticateCustomer
      operationId: post_cloud_api_System_authenticateCustomer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountInfo:
                    '$ref': '#/components/schemas/AccountInfo'
                  code:
                    type: string
                required:
                  - accountInfo
                  - code
              examples:
                authenticated:
                  '$ref': '#/components/examples/AuthenticateCustomerResponseValid'
        '429':
          description: Too Many Requests
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests allowed in the current window.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in the current window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when the current window resets.
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
              examples:
                tooManyRequests:
                  '$ref': '#/components/examples/RateLimitError'
            'application/problem+json':
              schema:
                '$ref': '#/components/schemas/ProblemDetails'
              examples:
                tooManyRequests:
                  '$ref': '#/components/examples/RateLimitProblem'
      x-confidence:
        samples: 1
        statusCodes:
          - 200
        normalizationFlags:
          - single-sample
          - single-status
        confidence: low
      x-sample-count: 1
      x-observed-auth:
        - 'authorization: Bearer undefined'
        - cf_clearance
        - __cf_bm
        - browser headers
      x-origin: 'https://fantasy402.com'
      security:
        - cloudflareClearance: []
          cloudflareBotManagement: []
          browserUserAgent: []
          browserAjaxHeader: []
      x-required-roles:
        - ROLE_AGENT
        - ROLE_MASTER
        - ROLE_SUB_AGENT
      x-security-review:
        authenticationRequired: true
        hierarchyCheckRequired: true
        source: post-processed observed contract
      x-rate-limit:
        limit: 20
        window: 60
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              '$ref': '#/components/schemas/AuthenticateCustomerRequest'
            examples:
              redacted:
                '$ref': '#/components/examples/AuthenticateCustomerRequestRedacted'
