name = "fantasy402-ingestion"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "SESSION_KV", id = "<YOUR_KV_ID>", preview_id = "<YOUR_KV_PREVIEW_ID>" }
]

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "fantasy402-analytics"
database_id = "<YOUR_D1_ID>"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RAW_ARCHIVE"
bucket_name = "fantasy402-raw"
preview_bucket_name = "fantasy402-raw-preview"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
FANTASY402_BASE_URL = "https://fantasy402.com"
FANTASY402_INGESTION_ENDPOINTS = "getAgentPerformance,getAgentBilling,getEnterTransactions"
